# ------------------------------------------------------------
# Habilidades de Lenhador
# ------------------------------------------------------------
lenhador:
  double-drop:
    # Chance base em pontos percentuais por nível. 0,05 = 5% no nível 100.
    chance-por-nivel: 0.05
    chance-maxima: 50.0

  tree-feller:
    nivel-desbloqueio: 25
    # Limite de segurança para evitar derrubar estruturas enormes.
    max-troncos: 64

  leaf-cutter:
    # Remove folhas próximas depois que uma árvore é derrubada pelo Tree Feller.
    remover-folhas-automaticamente: true
    raio: 5
    max-folhas: 200
    # O Leaf Cutter acelera a decadência natural das folhas, sem quebrá-las instantaneamente.
    # Nível 1 usa como referência ~120s; níveis altos chegam a ~12s.
    tempo-nivel-1-segundos: 120.0
    tempo-nivel-500-segundos: 30.0
    tempo-nivel-1000-segundos: 12.0
    # Variação aleatória para as folhas não desaparecerem todas juntas.
    variacao-aleatoria-segundos: 0.35

  machado-reforcado:
    # Chance de impedir 1 ponto de dano de durabilidade por nível.
    chance-preservar-por-nivel: 0.05

  colheita-eficiente:
    nivel-desbloqueio: 50
    # Bônus adicional de preservação por nível após o desbloqueio.
    bonus-por-nivel: 0.025

  critico-lenhador:
    nivel-desbloqueio: 150
    # 0,15% no nível 150, aumentando 0,05 ponto percentual a cada 100 níveis.
    chance-inicial: 0.15
    incremento-por-100-niveis: 0.05
    chance-maxima: 0.50

  combo-de-corte:
    nivel-desbloqueio: 100
    # 6 árvores quebradas em até 15s ativam o primeiro estágio do combo.
    arvores-para-x2: 6
    janela-inicial-segundos: 15
    # Depois do primeiro estágio, cada novo estágio exige mais 5 árvores em até 12s.
    arvores-por-proximo-nivel: 5
    janela-apos-x2-segundos: 12
    bonus-por-estagio: 0.05
    bonus-maximo: 0.20

  replantio-automatico:
    # Passiva desbloqueada a partir deste nível.
    nivel-desbloqueio: 10
    # Chance em pontos percentuais por nível. Nível 10 = 1%, nível 1000 = 100%.
    chance-por-nivel: 0.10
    # Mensagem global exibida a cada 100 árvores replantadas automaticamente.
    # {jogador} = nickname e {arvores} = total acumulado pelo jogador.
    mensagem-marco: |-
      
      ✦ &fO jogador {jogador} &fajudou a preservar a floresta ao replantar automaticamente &2&l{arvores} &fárvores com a habilidade Replantio Automático do Lenhador! &a🌳
      

  ervanismo:
    WHEAT: 45
    CARROTS: 30
    POTATOES: 30
    BEETROOTS: 35
    NETHER_WART: 50
    MELON: 25
    PUMPKIN: 25
    SUGAR_CANE: 20
    CACTUS: 20
    BAMBOO: 10
    COCOA: 30
    SWEET_BERRY_BUSH: 25

  # XP fixo dado por cada peixe/item pescado com sucesso
  pesca:
    xp-por-pesca: 100

  fundicao:
    # XP recebido para cada item retirado de uma fornalha, alto-forno ou defumador.
    xp-por-item-fundido: 15

  reparacao:
    # XP recebido ao retirar um item realmente reparado da bigorna.
    xp-por-reparo: 75

  combate:
    xp-por-acerto-espada: 15
    xp-por-acerto-machado: 18
    xp-por-acerto-desarmado: 12
    xp-por-acerto-arco: 20
    xp-por-acerto-clava: 22
    xp-por-acerto-tridente: 24
    xp-por-acerto-besta: 22
    xp-por-acerto-lanca: 24
    # Se true, acertar OUTROS JOGADORES tambem da XP de combate (PVP).
    # Por padrao false, para evitar dois jogadores se baterem so para farmar XP.
    contar-pvp: false

  acrobacia:
    # XP ganho por dano de queda sobrevivido, multiplicado pelo dano (em corações*2)
    xp-por-ponto-de-dano-queda: 8
    # Chance de "rolar" e anular o dano de queda, igual ao Roll do mcMMO original.
    # chance final = min(chance-role-maxima, nivel-atual * chance-role-por-nivel)
    chance-role-por-nivel: 0.002
    chance-role-maxima: 0.4

  domesticacao:
    xp-por-domesticar: 250

  alquimia:
    xp-por-pocao-fermentada: 150

# ------------------------------------------------------------
