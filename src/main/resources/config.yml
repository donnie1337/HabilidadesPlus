# ------------------------------------------------------------
# Habilidade especial de Mineracao: Super Breaker
# Clique direito segurando uma picareta para ativar.
# A duracao cresce com o nivel de Mineracao e possui um teto configuravel.
# ------------------------------------------------------------
mineracao:
  veio-farto:
    # A chance de drop duplo aumenta 0,1 ponto percentual por nível.
    chance-drop-duplo-por-nivel: 0.1
  mineracao-precisa:
    # Poder desbloqueado a partir deste nivel de Mineracao.
    nivel-desbloqueio: 75
    # Chance de preservar a durabilidade da picareta por nivel, em pontos percentuais.
    chance-preservar-por-nivel: 0.1
  superbreaker:
    # Habilidade desbloqueada a partir deste nivel de Mineracao.
    nivel-desbloqueio: 10
    # Duracao progressiva: nivel 10 = 5s, nivel 50 = 6s, nivel 100 = 7s,
    # nivel 250 = 10s, nivel 500 = 15s e nivel 1000 = 20s.
    duracao-nivel-10: 5.0
    duracao-nivel-50: 6.0
    duracao-nivel-100: 7.0
    duracao-nivel-150: 8.0
    duracao-nivel-200: 9.0
    duracao-nivel-250: 10.0
    duracao-nivel-500: 15.0
    duracao-nivel-1000: 20.0
    # Recarga progressiva: nivel 10 = 120s, nivel 50 = 140s,
    # e +20s a cada 50 niveis ate o nivel 1000.
    recarga-nivel-10: 120
    recarga-nivel-50: 140
    recarga-incremento-50-niveis: 20
    # Chance de drop triplo durante o Super Quebrador, em pontos percentuais por 10 níveis.
    chance-drop-triplo-por-10-niveis: 0.5
