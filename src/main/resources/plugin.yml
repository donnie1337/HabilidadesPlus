name: HabilidadesPlus
version: '${project.version}'
main: com.rpgcustom.habilidadesplus.HabilidadesPlus
api-version: '26.2'
softdepend: [PlaceholderAPI, CargoPlus, ChatPlus]
author: SeuServidor
description: Plugin de RPG customizado inspirado no mcMMO - XP e nivel na action bar, menu via /mcmmo

commands:
  habilidades:
    description: Abre o menu do HabilidadesPlus
    usage: /mcmmo [reload|setnivel <habilidade> <nivel>]
    aliases: [mcmmo, habilidade, poder]

  coleta:
    description: Ativa ou desativa a coleta automatica de drops
    usage: /coleta
    permission: habilidadesplus.coleta
    permission-message: "§cVoce nao tem permissao para usar /coleta."

  luz:
    description: Ativa ou desativa a visao noturna
    usage: /luz
    permission: habilidadesplus.luz
    permission-message: "§cVoce nao tem permissao para usar /luz."


permissions:
  habilidadesplus.admin:
    description: Permite recarregar a configuracao do plugin e definir niveis para testes
    default: op
  habilidadesplus.coleta:
    description: Permite usar o comando /coleta
    default: op
  habilidadesplus.luz:
    description: Permite usar o comando /luz
    default: op
