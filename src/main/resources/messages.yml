# ============================================================
#  HabilidadesPlus - messages.yml
#  Use '&' para cores. Placeholders disponiveis em cada mensagem
#  estao indicados entre chaves {assim}.
# ============================================================

actionbar:
  # {habilidade} = nome da habilidade, {xp} = xp ganho no lote, {nivel} = nivel atual
  formato-xp: "&f{habilidade}&7: &a+{xp} XP &7(Nivel: {nivel})"
  # separador usado quando mais de uma habilidade ganha XP no mesmo lote
  separador: " &8| "

level-up:
  titulo: "&a&lSUBIU DE NIVEL!"
  subtitulo: "&f{habilidade} agora e nivel &e{nivel}&f!"
  som: ENTITY_PLAYER_LEVELUP

comandos:
  sem-permissao: "&cVoce nao tem permissao para usar este comando."
  apenas-jogador: "&cEste comando so pode ser usado por jogadores."
  reload-sucesso: "&aConfiguracoes do HabilidadesPlus recarregadas com sucesso!"

acrobacia:
  mensagem-role: "&b&lVoce rolou e absorveu o dano da queda!"

gui:
  titulo-menu: "&8&lHabilidadesPlus &7- Habilidades"
  titulo-habilidade: "&8Habilidades &8• &b{habilidade}"
  item-habilidade-nome: "&b{habilidade} &8• &7Nivel &a{nivel}"
  item-xp: "&7XP: &f{xpAtual} &7/ &f{xpNecessario}"
  item-nivel-maximo: "&6&lNIVEL MAXIMO!"
  lista-poderes: "&7Poderes:"
  linha-poder: "&8• &7Nivel &f{nivel}&7: {poder} {estado}"
  estado-desbloqueado: "&a✓"
  estado-bloqueado: "&8✖"
  estado-planejado: "&e(planejado)"
  clique-poderes: "&aClique para ver os poderes."
  item-poder-nivel: "&7Desbloqueio: &fNivel {nivel}"
  item-poder-desbloqueado: "&a✓ Poder funcional e desbloqueado"
  item-poder-bloqueado: "&8✖ Poder funcional, ainda bloqueado"
  item-poder-planejado: "&e⚠ Poder planejado; ainda sem efeito no jogo"
  voltar-nome: "&cVoltar"
  voltar-lore: "&7Clique para voltar as habilidades."
  item-perfil-nome: "&b{jogador} &8• &7Poder &a{poder}"
  item-perfil-habilidades: "&7Niveis das habilidades:"
  item-perfil-linha: "&8• &7{habilidade}: &a{nivel}"
