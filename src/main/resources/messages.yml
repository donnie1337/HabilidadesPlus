# ============================================================
#  HabilidadesPlus - messages.yml
#  Use '&' para cores. Placeholders disponiveis em cada mensagem
#  estao indicados entre chaves {assim}.
# ============================================================

actionbar:
  # Action Bar normal exibida a cada ganho de XP.
  formato-progresso: "&f{habilidade} &8| &a+{xpGanho} XP &8| &f{xpAtual}/{xpNecessario}XP &8| &7Nivel: &e{nivel}"
  # Tempo que a mensagem de subida de nivel permanece sobrepondo novos ganhos de XP.
  duracao-level-up-ticks: 40

poder:
  # Mensagens exibidas no chat ao cruzar o marco de 100 pela primeira vez.
  milestone-geral: "&6&lPODER &8» &eO jogador {jogador} &fatingiu &e100 &fde poder!"
  milestone-habilidade: "&6&lPODER &8» &eO jogador {jogador} &fatingiu &e100 &fde poder em &e{habilidade}&f!"

level-up:
  # Aviso exibido somente ao atingir 100, 200, 300, 400, 500... em uma habilidade.
  actionbar: "&a&lSUBIU DE NÍVEL! &fAgora você é nível &e{nivel} &fem {habilidade}&f!"
  titulo: "&a&lSUBIU DE NÍVEL!"
  subtitulo: "&f{habilidade} agora é nível &e{nivel}&f!"
  som: ENTITY_PLAYER_LEVELUP

comandos:
  sem-permissao: "&cVocê não tem permissão para usar este comando."
  apenas-jogador: "&cEste comando só pode ser usado por jogadores."
  reload-sucesso: "&aConfigurações do HabilidadesPlus recarregadas com sucesso!"
  setnivel-uso: "&eUso: /mcmmo setnivel <habilidade> <nivel>"
  setnivel-habilidade-invalida: "&cHabilidade inválida."
  setnivel-nivel-invalido: "&cNível inválido. Informe um número inteiro."
  setnivel-fora-do-limite: "&cO nível deve estar entre 0 e {maximo}."
  setnivel-sucesso: "&a{habilidade} definida para o nível &e{nivel}&a."

mineracao:
  superbreaker-ativado: "&6&lSUPER QUEBRADOR! &fAtivado por &e{duracao}s &fno nível &e{nivel}&f."\n  superbreaker-em-recarga: "&cSuper Quebrador em recarga! Aguarde &e{segundos} segundos&c para usar novamente."

acrobacia:
  mensagem-role: "&b&lVocê rolou e absorveu o dano da queda!"

gui:
  titulo-menu: "&8&lHabilidadesPlus &7- Habilidades"
  titulo-habilidade: "&8Habilidades &8• &b{habilidade}"
  item-habilidade-nome: "&b{habilidade} &8• &7Nível &a{nivel}"
  item-xp: "&7XP: &f{xpAtual} &7/ &f{xpNecessario}"
  item-nivel-maximo: "&6&lNÍVEL MÁXIMO!"
  lista-poderes: "&7Poderes:"
  linha-poder: "&8• &7Nível &f{nivel}&7: {poder} {estado}"
  estado-desbloqueado: "&a✓"
  estado-bloqueado: "&8✖"
  estado-planejado: "&e(planejado)"
  clique-poderes: "&aClique para ver os poderes."
  veio-farto-chance: "&7Chance atual: &e{chance}%"
  superbreaker-chance: "&7Chance atual: &e{chance}%"
  mineracao-precisa-chance: "&7Chance de preservar: &e{chance}%"
  item-poder-nivel: "&7Desbloqueio: &fNível {nivel}"
  item-poder-desbloqueado: "&a✓ Poder funcional e desbloqueado"
  item-poder-bloqueado: "&8✖ Poder funcional, ainda bloqueado"
  item-poder-planejado: "&e⚠ Poder planejado; ainda sem efeito no jogo"
  voltar-nome: "&cVoltar"
  voltar-lore: "&7Clique para voltar às habilidades."
  item-perfil-nome: "&b{jogador} &8• &7Poder &a{poder}"
  item-perfil-habilidades: "&7Níveis das habilidades:"
  item-perfil-linha: "&8• &7{habilidade}: &a{nivel}"
