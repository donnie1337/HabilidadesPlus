name: Build HabilidadesPlus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar plugin
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar com Maven
        run: mvn -B clean package --no-transfer-progress

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: habilidadeplus
          path: target/habilidadeplus.jar
          if-no-files-found: error
